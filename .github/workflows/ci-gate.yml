name: CI Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check critical files exist and have content
        run: |
          ERRORS=0
          MIN_SIZE=100
          for FILE in \
            package.json \
            lib/aggregator-consumer.js \
            lib/readme-generator.js \
            lib/storage/r2-client.js
          do
            if [ ! -f "$FILE" ]; then
              echo "::error file=$FILE::Critical file missing: $FILE"
              ERRORS=$((ERRORS + 1))
              continue
            fi
            SIZE=$(wc -c < "$FILE")
            if [ "$SIZE" -lt "$MIN_SIZE" ]; then
              echo "::error file=$FILE::$FILE is ${SIZE} bytes (minimum: ${MIN_SIZE}). Possible blob corruption."
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: $ERRORS check(s) failed"
            exit 1
          fi
          echo "PASS: All critical files present and non-trivial"

      - name: Validate JSON files are parseable
        run: |
          if [ -f "package.json" ]; then
            if ! node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" 2>/dev/null; then
              echo "::error file=package.json::package.json is not valid JSON"
              exit 1
            fi
          fi
          echo "PASS: All JSON files valid"

      - name: Syntax check all JS files
        run: |
          ERRORS=0
          while IFS= read -r -d '' FILE; do
            if ! node -c "$FILE" 2>/dev/null; then
              echo "::error file=$FILE::Syntax error in $FILE"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: $ERRORS syntax error(s)"
            exit 1
          fi
          echo "PASS: All JS files valid syntax"

      - name: Run visa eligibility regression test
        run: node lib/__tests__/visa-eligibility.test.js
      - name: Check README cover template invariant
        run: |
          if ! grep -q 'images/covers/cover.png' lib/readme-generator.js; then
            echo "::error file=lib/readme-generator.js::README generator must render images/covers/cover.png as the top cover image"
            exit 1
          fi
          if grep -q 'images/${config.repoPrefix}-heading.png' lib/readme-generator.js; then
            echo "::error file=lib/readme-generator.js::README generator must not render repoPrefix heading images as the top cover image"
            exit 1
          fi
          echo "PASS: README cover template uses images/covers/cover.png"


      - name: Check require() paths resolve
        run: |
          ERRORS_FILE=$(mktemp)
          echo "0" > "$ERRORS_FILE"
          while IFS= read -r -d '' FILE; do
            # Extract relative require() paths (./ or ../)
            grep -oP "require\(['\"](\.\.?/[^'\"]+)['\"]\)" "$FILE" | grep -oP "(?<=['\"])\.\.?/[^'\"]+" | while read -r REQ; do
              DIR=$(dirname "$FILE")
              RESOLVED="$DIR/$REQ"
              FOUND=false
              for CANDIDATE in "$RESOLVED" "$RESOLVED.js" "$RESOLVED/index.js"; do
                if [ -f "$CANDIDATE" ]; then
                  FOUND=true
                  break
                fi
              done
              if [ "$FOUND" = "false" ]; then
                echo "::error file=$FILE::$FILE requires '$REQ' but no matching file found (tried $RESOLVED, $RESOLVED.js, $RESOLVED/index.js)"
                echo "$(( $(cat "$ERRORS_FILE") + 1 ))" > "$ERRORS_FILE"
              fi
            done
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          ERRORS=$(cat "$ERRORS_FILE")
          rm -f "$ERRORS_FILE"
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: $ERRORS unresolved require() path(s)"
            exit 1
          fi
          echo "PASS: All require() paths resolve"

      - name: Deletion threshold check
        if: github.event_name == 'push'
        run: |
          DELETION_THRESHOLD=10
          DELETED=$(git diff --name-only --diff-filter=D HEAD~1 HEAD 2>/dev/null | grep -v '^node_modules/' || echo "")
          COUNT=$(echo "$DELETED" | grep -c . || true)
          if [ "$COUNT" -gt "$DELETION_THRESHOLD" ]; then
            echo "::error::$COUNT files deleted in this commit (threshold: $DELETION_THRESHOLD). Possible mass-deletion."
            echo "Deleted files:"
            echo "$DELETED"
            exit 1
          fi
          echo "PASS: Deletion count ($COUNT) within threshold ($DELETION_THRESHOLD)"
